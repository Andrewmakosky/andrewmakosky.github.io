<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Vehicle Checklist</title>
  <meta name="description" content="Pre-trip inspection checklist for snow vehicles and equipment.">
  <meta name="theme-color" content="#0b3d63">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Checklist">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="icons/icon.svg" alt="" width="32" height="32">
      <div>
        <div class="brand-name" id="brandName">Creative Snow by Cowbay</div>
        <div class="brand-sub">Vehicle inspection</div>
      </div>
    </div>
    <div class="progress" aria-live="polite"><span id="progressText">0 / 0</span></div>
  </header>

  <main id="formView">
    <form id="checkForm" novalidate>
      <section class="card">
        <h2>Vehicle &amp; operators</h2>
        <label class="field">
          <span>Company</span>
          <input id="company" name="company" autocomplete="organization" required>
        </label>
        <div class="field">
          <span class="label">Operators for this vehicle</span>
          <div id="operators"></div>
          <button type="button" class="btn ghost small" id="addOperatorBtn">+ Add another operator</button>
        </div>
        <label class="field">
          <span>Unit / vehicle #</span>
          <input id="unit" name="unit" required autocapitalize="characters">
        </label>
        <label class="field">
          <span>Type of vehicle</span>
          <select id="vehicleType" name="vehicleType" required></select>
        </label>
        <label class="field" id="vehicleOtherField" hidden>
          <span>What kind of vehicle?</span>
          <input id="vehicleOther" name="vehicleOther">
        </label>
        <label class="field">
          <span>Odometer / hours</span>
          <input id="odometer" name="odometer" inputmode="decimal">
        </label>
        <div class="field">
          <span class="label">Vehicle photo</span>
          <div class="photos" data-photos="vehicle"></div>
          <button type="button" class="photo-btn wide" data-add-photo="vehicle">📷 Add vehicle photo<span class="count"></span></button>
        </div>
        <label class="field">
          <span>Site / route (optional)</span>
          <input id="site" name="site">
        </label>
      </section>

      <div class="quick">
        <button type="button" class="btn ghost" id="allOkBtn">Mark remaining as Pass</button>
      </div>

      <div id="checklist"></div>

      <section class="card">
        <h2>Overall</h2>
        <fieldset class="field">
          <legend>Is this vehicle safe to operate?</legend>
          <div class="seg seg-2" role="radiogroup">
            <label><input type="radio" name="safe" value="Yes" required><span>Yes</span></label>
            <label><input type="radio" name="safe" value="No"><span>No — do not use</span></label>
          </div>
        </fieldset>
        <div class="field">
          <label for="notes"><span class="label">Other notes / damage</span></label>
          <textarea id="notes" name="notes" rows="3"></textarea>
          <div class="photos" data-photos="notes"></div>
          <button type="button" class="photo-btn wide" data-add-photo="notes">📷 Add photo</button>
        </div>
        <div class="policy" id="policy"></div>
        <label class="field">
          <span>Name of inspector</span>
          <input id="inspector" name="inspector" autocomplete="name" required>
        </label>
        <label class="check">
          <input type="checkbox" id="certify" required>
          <span>I inspected this vehicle and the report is accurate.</span>
        </label>
      </section>

      <p class="error" id="formError" role="alert" hidden></p>

      <div class="actions">
        <button type="submit" class="btn primary" id="submitBtn">Submit report</button>
        <button type="button" class="btn ghost danger" id="resetBtn">Clear form</button>
      </div>
      <p class="version" id="appVersion"></p>
    </form>
    <input type="file" id="photoInput" accept="image/*" multiple hidden>
  </main>

  <main id="doneView" hidden>
    <section class="card done">
      <div class="done-icon" aria-hidden="true" id="doneIcon">✓</div>
      <h2 id="doneTitle">Report sent</h2>
      <p id="doneMsg"></p>
      <div class="recipient" id="recipientBox" hidden>
        <span id="recipientText"></span>
        <button type="button" class="copy-btn" id="copyBtn">Copy</button>
      </div>
      <div class="actions">
        <button type="button" class="btn primary" id="sharePdfBtn" hidden>Email PDF report</button>
        <button type="button" class="btn ghost" id="downloadBtn">Save PDF to phone</button>
        <button type="button" class="btn ghost" id="mailtoBtn" hidden>Email without PDF</button>
        <button type="button" class="btn ghost" id="newBtn">Start a new checklist</button>
      </div>
    </section>
  </main>

  <script src="version.js"></script>
  <script src="config.js"></script>
  <script src="vendor/jspdf.umd.min.js"></script>
  <script src="report.js"></script>
  <script src="app.js"></script>
</body>
</html>
